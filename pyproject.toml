[tool.ruff]
required-version = "==0.12.12"
target-version = "py310"
line-length = 88
extend-exclude = ["vendor", "inputs", "build", ".build", "toolchains"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["build"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
