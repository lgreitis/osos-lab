[package]
name = "reprise-device"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
vendored-usb = ["rusb/vendored"]

[dependencies]
serde.workspace = true
sha2.workspace = true
sha1 = "0.10"
thiserror.workspace = true
rusb.workspace = true

serde_json.workspace = true
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }
