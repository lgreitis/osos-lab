[workspace]
members = ["crates/reprise-device", "crates/reprise-cli", "crates/reprise-bundle"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
rusb = "0.9.4"
